name: Trend-Scout

# Sucht wöchentlich erfolgreiche englische Shorts, zerlegt ihr Erfolgsrezept und legt
# daraus deutsche Serienthemen an (tools/trend_scout.py). Läuft vor dem Tageslauf.
on:
  schedule:
    - cron: "0 3 * * 6"   # samstags 03:00 UTC
  workflow_dispatch:
    inputs:
      top:
        description: "Wie viele Videos analysieren"
        default: "5"
      urls:
        description: "Optional: eigene Reel-/TikTok-Links, durch Leerzeichen getrennt"
        default: ""

permissions:
  contents: write

concurrency: trends  # eigene Gruppe, sonst verdrängt ein wartender Tageslauf diesen Lauf

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pip install -r requirements.txt yt-dlp faster-whisper
      - name: Eigene Links transkribieren
        if: ${{ inputs.urls != '' }}
        continue-on-error: true
        run: python tools/analyze_reels.py ${{ inputs.urls }} --max 3 --out /tmp/research
      - name: Trends suchen und adaptieren
        run: python tools/trend_scout.py --top ${{ inputs.top || '5' }} --research /tmp/research
      - name: Ergebnisse speichern
        if: always()
        run: |
          git config user.name "ki-reels-bot"
          git config user.email "ki-reels-bot@users.noreply.github.com"
          git add -A -- data
          git commit -qm "Trend-Scout $(date +%F)" || { echo "nichts zu speichern"; exit 0; }
          git pull --rebase -q && git push
