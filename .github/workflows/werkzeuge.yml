name: Werkzeuge

on:
  workflow_dispatch:
    inputs:
      task:
        description: "analyse, stimmen oder beides"
        default: "beides"
      urls:
        description: "Reel- oder Profil-Links, durch Leerzeichen getrennt"
        default: ""
      max:
        description: "Max. Reels pro Link"
        default: "5"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pip install -r requirements.txt yt-dlp faster-whisper
      - name: Reels analysieren
        if: ${{ inputs.task != 'stimmen' && inputs.urls != '' }}
        continue-on-error: true
        run: python tools/analyze_reels.py ${{ inputs.urls }} --max ${{ inputs.max }} --out /tmp/research
      - name: Stimmproben
        if: ${{ inputs.task != 'analyse' }}
        continue-on-error: true
        run: python tools/voice_samples.py --out /tmp/research/stimmen
      - name: Ergebnisse in Branch „research“ speichern
        run: |
          git config user.name "ki-reels-bot"
          git config user.email "ki-reels-bot@users.noreply.github.com"
          git fetch origin research || true
          if git rev-parse --verify origin/research >/dev/null 2>&1; then
            git worktree add /tmp/r origin/research && cd /tmp/r && git checkout -B research
          else
            git worktree add --detach /tmp/r && cd /tmp/r && git checkout --orphan research && git rm -rfq .
          fi
          cp -r /tmp/research/. . 2>/dev/null || true
          git add -A && (git commit -qm "Werkzeuge $(date +%F_%H%M)" || true) && git push origin research
