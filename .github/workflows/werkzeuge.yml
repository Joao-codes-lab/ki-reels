name: Werkzeuge

on:
  schedule:
    - cron: "0 21 * * *"  # Nacht-Wettbewerbsanalyse: neueste Reels der Vorbilder
  workflow_dispatch:
    inputs:
      task:
        description: "analyse, rhythmus, tiefe, musik, musikbib, stimmen, beides, stile oder figuren"
        default: "beides"
      urls:
        description: "Reel- oder Profil-Links, durch Leerzeichen getrennt"
        default: ""
      max:
        description: "Max. Reels pro Link"
        default: "5"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      TASK: ${{ inputs.task || 'analyse' }}
      URLS: ${{ inputs.urls || vars.VORBILDER || 'https://www.instagram.com/_8_levels/ https://www.instagram.com/simpsonsvorhersage.n/ https://www.instagram.com/herr.amorim/' }}
      MAX: ${{ inputs.max || '3' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pip install -r requirements.txt yt-dlp faster-whisper
      - name: Reels analysieren
        if: ${{ (env.TASK == 'analyse' || env.TASK == 'beides') && env.URLS != '' }}
        continue-on-error: true
        run: python tools/analyze_reels.py $URLS --max $MAX --out /tmp/research
      - name: Posting-Rhythmus und Hit-Muster
        if: ${{ env.TASK == 'rhythmus' }}
        continue-on-error: true
        run: python tools/profile_stats.py $URLS --max ${{ inputs.max || '60' }} --out /tmp/research/rhythmus
      - name: Tiefenanalyse (Serien, Story-Typen, Art-Style, Rezept)
        if: ${{ env.TASK == 'tiefe' }}
        continue-on-error: true
        run: |
          git fetch -q origin research && mkdir -p /tmp/rhythmus
          for f in $(git ls-tree --name-only origin/research rhythmus/ | grep json); do git show "origin/research:$f" > /tmp/$f; done
          timeout 75m python -u tools/deep_analysis.py $URLS --rhythmus /tmp/rhythmus --top ${{ inputs.max || '8' }} --flop 3 --out /tmp/research/tiefe
      - name: Hintergrundmusik der Vorbilder
        if: ${{ env.TASK == 'musik' }}
        continue-on-error: true
        run: python -u tools/music_probe.py $URLS --out /tmp/research/musik
      - name: Musik-Bibliothek nach Stimmung (incompetech, CC BY)
        if: ${{ env.TASK == 'musikbib' }}
        continue-on-error: true
        run: python -u tools/music_library.py --out /tmp/research/musik_bib ${{ inputs.urls && format('--moods {0}', inputs.urls) || '' }}
      - name: Stimmproben
        if: ${{ inputs.task == 'stimmen' || inputs.task == 'beides' }}
        continue-on-error: true
        run: python tools/voice_samples.py --out /tmp/research/stimmen
      - name: Stilproben (Bild-KI)
        if: ${{ inputs.task == 'stile' }}
        continue-on-error: true
        run: python tools/style_samples.py --out /tmp/research/stile
      - name: Figuren-Proben (Bild-KI)
        if: ${{ inputs.task == 'figuren' }}
        continue-on-error: true
        run: python tools/style_samples.py --set figuren --out /tmp/research/figuren
      - name: Ergebnisse in Branch „research“ speichern
        if: always()
        run: |
          git config user.name "ki-reels-bot"
          git config user.email "ki-reels-bot@users.noreply.github.com"
          git fetch origin research || true
          if git rev-parse --verify origin/research >/dev/null 2>&1; then
            git worktree add /tmp/r origin/research && cd /tmp/r && git checkout -B research
          else
            git worktree add --detach /tmp/r && cd /tmp/r && git checkout --orphan research && git rm -rfq .
          fi
          cp -r /tmp/research/. . 2>/dev/null || true
          git add -A && (git commit -qm "Werkzeuge $(date +%F_%H%M)" || true)
          for i in 1 2 3; do git push origin research && break; git pull -q --rebase origin research; done
