name: Tägliche Videos

on:
  schedule:
    - cron: "0 5 * * *"   # täglich 05:00 UTC (06:00/07:00 deutscher Zeit)
  workflow_dispatch:
    inputs:
      count:
        description: "Anzahl Themen (je Thema ein Video pro Sprache)"
        default: "1"
      post:
        description: "Bei Buffer einplanen?"
        type: boolean
        default: true

permissions:
  contents: write

concurrency: daily

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      BUFFER_KEY_DE: ${{ secrets.BUFFER_KEY_DE }}
      BUFFER_KEY_EN: ${{ secrets.BUFFER_KEY_EN }}
      LANGS: ${{ vars.LANGS || 'de,en' }}
      VIDEOS_PER_RUN: ${{ inputs.count || vars.VIDEOS_PER_RUN || '1' }}
      PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pip install -r requirements.txt

      - name: Videos erzeugen
        run: python run_daily.py generate

      - name: Videos auf GitHub Pages veröffentlichen (letzte 10 Tage)
        run: |
          git config user.name "ki-reels-bot"
          git config user.email "ki-reels-bot@users.noreply.github.com"
          git fetch origin gh-pages || true
          rm -rf /tmp/pages
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git worktree add /tmp/pages origin/gh-pages
            cd /tmp/pages && git checkout -B gh-pages
          else
            git worktree add --detach /tmp/pages
            cd /tmp/pages && git checkout --orphan gh-pages && git rm -rfq . && cd -
            cd /tmp/pages
          fi
          mkdir -p videos
          cp "$GITHUB_WORKSPACE"/site/videos/*.mp4 videos/
          cutoff=$(date -d '-10 days' +%F)
          for f in videos/*.mp4; do n=$(basename "$f"); [[ "${n:0:10}" < "$cutoff" ]] && rm -f "$f" || true; done
          touch .nojekyll
          echo '<meta charset="utf-8"><p>KI-Reels Medienablage</p>' > index.html
          git add -A && git commit -qm "Videos $(date +%F)" && git push -f origin gh-pages

      - name: Warten, bis die Videos online sind
        run: |
          f=$(ls site/videos/*.mp4 | head -1 | xargs basename)
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$PAGES_URL/videos/$f")
            [ "$code" = "200" ] && echo "online" && exit 0
            sleep 20
          done
          echo "Pages noch nicht erreichbar" && exit 1

      - name: Bei Buffer einplanen
        if: ${{ github.event_name == 'schedule' || inputs.post }}
        run: python run_daily.py post

      - name: Verlauf speichern
        if: always()
        run: |
          git add data content
          git commit -qm "Verlauf $(date +%F)" || echo "nichts zu speichern"
          git push

      - name: Videos als Download anhängen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos
          path: site/videos/*.mp4
          retention-days: 14
